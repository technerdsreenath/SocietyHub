<!DOCTYPE html>
<html lang="en" class="h-full bg-[#F8F9FA]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Society Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full font-sans text-[#2F3E46] bg-[#F8F9FA] flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white border border-[#DDE5E8] rounded-2xl p-8 shadow-sm">
        <h1 class="font-bold text-lg mb-2 text-[#2F3E46]">Set New Password</h1>
        <p class="text-xs text-[#6C7A89] mb-6">Please enter your new password twice so we can verify you typed it correctly.</p>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-[#4F6D7A] text-white font-bold py-3 rounded-xl text-xs transition-all mt-4 hover:bg-[#3d5560]">
                Change My Password
            </button>
        </form>
    </div>
    <script>
        document.querySelectorAll('input').forEach(el => {
            el.className = 'w-full bg-[#F8F9FA] border border-[#DDE5E8] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#4F6D7A] mt-1';
        });
    </script>
</body>
</html>
