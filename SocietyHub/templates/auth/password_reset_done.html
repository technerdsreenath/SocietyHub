<!DOCTYPE html>
<html lang="en" class="h-full bg-[#F8F9FA]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Email - Society Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full font-sans text-[#2F3E46] bg-[#F8F9FA] flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white border border-[#DDE5E8] rounded-2xl p-8 shadow-sm text-center">
        <h1 class="font-bold text-lg mb-2 text-[#2F3E46]">Check Your Email</h1>
        <p class="text-xs text-[#6C7A89] mb-6">We've emailed you instructions for setting your password. If an account exists with the email you entered, you should receive them shortly.</p>
        <a href="{% url 'login' %}" class="inline-block w-full bg-[#4F6D7A] text-white font-bold py-3 rounded-xl text-xs transition-all text-center hover:bg-[#3d5560]">
            Return to Sign In
        </a>
    </div>
</body>
</html>
