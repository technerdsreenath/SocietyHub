<!DOCTYPE html>
<html lang="en" class="h-full bg-[#F8F9FA]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Society Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        portal: {
                            primary: '#4F6D7A',
                            secondary: '#84A98C',
                            bg: '#F8F9FA',
                            card: '#FFFFFF',
                            text: '#2F3E46',
                            border: '#DDE5E8',
                            muted: '#6C7A89'
                        }
                    },
                    fontFamily: { sans: ['"Trebuchet MS"', 'sans-serif'] },
                    boxShadow: { 'card': '0 4px 16px -4px rgba(47, 62, 70, 0.06)' }
                }
            }
        }
    </script>
</head>
<body class="min-h-full font-sans text-portal-text bg-portal-bg flex items-center justify-center p-4 sm:p-6 overflow-y-auto">    <div class="w-full max-w-md mx-auto bg-portal-card border border-portal-border rounded-2xl shadow-card p-6 sm:p-8 my-8">
        <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 rounded-xl bg-portal-primary flex items-center justify-center text-white shadow-flat">
                <i data-lucide="user-plus" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-bold text-portal-text text-base tracking-tight">User Registration</h1>
                <p class="text-xs text-portal-muted font-medium">Join your society platform</p>
            </div>
    </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            {% if form.errors %}
                <div class="p-3 bg-red-50 border border-red-200 rounded-xl text-xs text-red-800 font-semibold">
                    Please correct the errors below.
                </div>
            {% endif %}

            {{ form.non_field_errors }}

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-5 gap-y-4">
                {% for field in form %}
                <div class="{% if field.name == 'full_name' or field.name == 'society' %}sm:col-span-2{% endif %}">
                    <label class="block text-[10px] font-bold uppercase text-portal-muted mb-1.5">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-[11px] text-red-600 mt-1 font-medium">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
                {% endfor %}
            </div>

            <button type="submit" class="w-full bg-portal-primary hover:bg-portal-primary/90 text-white font-bold py-3 rounded-xl text-xs shadow-flat transition-all mt-4">
                Create Account
            </button>
        </form>

        <p class="text-xs text-center text-portal-muted mt-6">
            Already have an account? <a href="{% url 'login' %}" class="font-bold text-portal-primary hover:underline">Sign in</a>
        </p>
    </div>
    <script>
        lucide.createIcons();
        // Add Tailwind styling dynamically to Django rendered form inputs
        document.querySelectorAll('input, select, textarea').forEach(el => {
            if (el.type !== 'hidden' && !el.classList.contains('w-full')) {
                el.className = 'w-full bg-portal-bg border border-portal-border rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-portal-primary';
            }
        });
        
    document.addEventListener('DOMContentLoaded', function () {
        const roleSelect = document.querySelector('select[name="role"]');
        const restrictedFields = ['wing', 'flat_number', 'flat_name', 'area_sqft'];

        function updateFieldStates() {
            if (!roleSelect) return;
            
            const selectedText = roleSelect.options[roleSelect.selectedIndex].text.toLowerCase();
            const selectedVal = roleSelect.value.toLowerCase();

            const isNonResident = 
                selectedText.includes('security') || 
                selectedText.includes('staff') || 
                selectedVal.includes('security') || 
                selectedVal.includes('staff');

            restrictedFields.forEach(fieldName => {
                const field = document.querySelector(`[name="${fieldName}"]`);
                if (field) {
                    if (isNonResident) {
                        field.disabled = true;
                        field.value = ''; // Clear value when locked
                    } else {
                        field.disabled = false;
                    }
                }
            });
        }

        if (roleSelect) {
            roleSelect.addEventListener('change', updateFieldStates);
            updateFieldStates(); // Run immediately on page load
        }
    });

    </script>
</body>
</html>
