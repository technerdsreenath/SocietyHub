<!DOCTYPE html>
<html lang="en" class="h-full bg-[#F8F9FA]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - SocietyHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1B3A32">
    <link rel="icon" type="image/png" href="/static/images/pwa-icon-192.png">
</head>
<body class="h-full flex items-center justify-center p-4 bg-gradient-to-br from-[#0F201B] via-[#1B3A32] to-[#2B4C42] text-white">
    <div class="max-w-md w-full bg-white/10 backdrop-blur-xl border border-white/20 p-8 rounded-3xl shadow-2xl text-center space-y-6">
        <div class="w-20 h-20 mx-auto rounded-2xl bg-white/10 border border-white/20 flex items-center justify-center text-emerald-300 shadow-inner">
            <i data-lucide="wifi-off" class="w-10 h-10 animate-pulse"></i>
        </div>

        <div class="space-y-2">
            <span class="px-3 py-1 bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded-full text-[11px] font-bold uppercase tracking-wider">
                Connection Lost
            </span>
            <h1 class="text-2xl font-extrabold text-white">You're Currently Offline</h1>
            <p class="text-xs text-white/80 leading-relaxed">
                SocietyHub requires an active internet connection to access real-time society notices, maintenance bills, and approvals.
            </p>
        </div>

        <div class="p-4 bg-white/5 border border-white/10 rounded-2xl text-left space-y-2">
            <div class="flex items-center gap-2 text-xs font-bold text-emerald-300">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                Automatic Reconnection
            </div>
            <p class="text-[11px] text-white/70">
                Your device will automatically reload this page once your internet connection is restored.
            </p>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 pt-2">
            <button onclick="window.location.reload();" class="flex-1 py-3 bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-extrabold rounded-xl text-xs shadow-lg transition-all flex items-center justify-center gap-2">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                Try Reconnecting
            </button>
            <button onclick="history.back();" class="py-3 px-4 bg-white/10 hover:bg-white/20 text-white font-bold rounded-xl text-xs border border-white/20 transition-all">
                Go Back
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        window.addEventListener('online', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
